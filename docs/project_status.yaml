headline: "Protocol v1.0 frozen. Experimental execution pending."

project:
  title: "Case-level reliability of glioma segmentation under missing MRI sequences"
  short_title: "Reliability under missing MRI sequences"
  owner: "Ayush Kushwaha"
  type: "Pre-registered empirical evaluation study"
  research_question: >-
    When MRI sequences are missing at inference, does the case-level ensemble uncertainty
    of a modality-dropout nnU-Net discriminate unreliable enhancing-tumour segmentations
    within a given missing-sequence condition, i.e. beyond what the known identity of the
    missing sequence provides? How does this vary with which sequence is missing, and do
    the discrimination and operating thresholds transfer to a held-out institution and an
    external population?
  central_question: >-
    Among cases with the same missing sequence, can ensemble disagreement identify which
    cases are likely to fail?

