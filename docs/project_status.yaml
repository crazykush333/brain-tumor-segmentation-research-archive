# Single source of truth for project state.
#
# Consumed by: the research-gate guards (src/brats_uncertainty/evaluation/guards.py),
# the README status line, and the website (exported to website/data/*.json by
# `brats-uncertainty export-site-data`). Never hand-edit website data.
#
# Rules (enforced by src/brats_uncertainty/evaluation/status.py):
#   - A gate may be CLOSED only with an existing evidence path and a closed_on date.
#   - Only gate-A items may be OWNER_WAIVED.
#   - B gates close strictly in protocol order (B1 before B2 ...).
#   - B7-B12 are LOCKED while any of B1-B6 is open.
#   - data/training/evaluation/results must agree with the gates.
#   - results.available may be true only with evidence (results/index.json).

schema_version: 1
